<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Flappy Block</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; font-family: sans-serif; }
    canvas { border: 2px solid #00d2ff; background: #181b24; }
  </style>
</head>
<body>
  <p>Click or Press Spacebar to Jump</p>
  <canvas id="game" width="320" height="480"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let birdY = 200, velocity = 0, gravity = 0.4, lift = -7;
    let pipes = [], frame = 0, score = 0, gameOver = false;

    function reset() {
      birdY = 200; velocity = 0; pipes = []; frame = 0; score = 0; gameOver = false;
    }

    function flap() {
      if (gameOver) reset();
      else velocity = lift;
    }

    window.addEventListener("keydown", e => { if (e.code === "Space") flap(); });
    canvas.addEventListener("mousedown", flap);

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        velocity += gravity;
        birdY += velocity;
        if (frame % 90 === 0) {
          let top = Math.random() * 220 + 40;
          pipes.push({ x: 320, top: top, bottom: top + 130, passed: false });
        }
        frame++;
      }

      ctx.fillStyle = "#00d2ff";
      ctx.fillRect(50, birdY, 24, 24);

      pipes.forEach(p => {
        if (!gameOver) p.x -= 2.5;
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(p.x, 0, 40, p.top);
        ctx.fillRect(p.x, p.bottom, 40, canvas.height - p.bottom);

        if (50 + 24 > p.x && 50 < p.x + 40 && (birdY < p.top || birdY + 24 > p.bottom)) gameOver = true;
        if (!p.passed && p.x + 40 < 50) { score++; p.passed = true; }
      });

      if (birdY + 24 > canvas.height || birdY < 0) gameOver = true;

      ctx.fillStyle = "#fff";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, 12, 30);
      if (gameOver) ctx.fillText("Game Over - Click to Restart", 35, 240);

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
